spring.application.name=SifapApplication
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
sifap.viewer.username=${SIFAP_VIEWER_USERNAME:viewer}
sifap.admin.username=${SIFAP_ADMIN_USERNAME:admin}
sifap.admin.password-hash=${SIFAP_ADMIN_PASSWORD_HASH}
sifap.viewer.password-hash=${SIFAP_VIEWER_PASSWORD_HASH}
sifap.jwt.secret=${SIFAP_JWT_SECRET}
sifap.legacy-url=${SIFAP_LEGACY_HEALTH_URL:https://sifap-lab-438k30.eastus2.cloudapp.azure.com/healthz}
sifap.ibge-url=${SIFAP_IBGE_STATES_URL:https://servicodados.ibge.gov.br/api/v1/localidades/estados}
