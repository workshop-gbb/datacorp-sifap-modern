name: Spec quality

on:
  push:
    branches: [main, develop, "spec/**", "impl/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Requirements trace to pinned legacy evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
      # Constitution P1, P3 and P8: a requirement with no evidence, a citation that
      # points at a moving branch instead of a pinned commit, or a blocking gate that
      # does not exist are all build failures. A guard nobody can fail is not a guard.
      - name: Validate requirement traceability
        run: python3 .github/scripts/validate-traceability.py
      - name: Validate the evidence register parses
        run: |
          set -euo pipefail
          python3 -c "import yaml; yaml.safe_load(open('docs/discovery/evidence-register.yaml'))"

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

  repo-hygiene:
    name: No state, credentials or plans tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # .gitignore does not stop `git add -f`, so the build refuses the artifacts
      # outright rather than trusting that nobody forces them in.
      - name: Fail if forbidden artifacts are tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.tfstate($|\.)|\.tfvars$|\.tfplan$|(^|/)id_(rsa|ed25519)$|\.(pem|pfx|p12|key)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Forbidden artifacts are tracked in this repository:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "No state, plan, credential or environment files are tracked."
