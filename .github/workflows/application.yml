name: Viewer application

on:
  push:
    branches: [main, develop, "impl/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify API, PostgreSQL, permissions, architecture and coverage
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10.30.3"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Verify UI and localization
        working-directory: frontend
        run: |
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test --coverage

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.6"
      - name: Validate isolated infrastructure without Azure credentials
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
          terraform -chdir=infra test
          bash -n infra/runtime/start.sh infra/runtime/seed-vault.sh

  live-viewer:
    if: github.event_name != 'pull_request' && vars.SIFAP_BASE_URL != ''
    needs: [backend, frontend, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10.30.3"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the published Azure viewer
        working-directory: frontend
        env:
          SIFAP_BASE_URL: ${{ vars.SIFAP_BASE_URL }}
          SIFAP_API_BASE: ${{ vars.SIFAP_BASE_URL }}
          SIFAP_VIEWER_USERNAME: viewer
          SIFAP_VIEWER_PASSWORD: ${{ secrets.SIFAP_VIEWER_PASSWORD }}
        run: pnpm test:e2e
